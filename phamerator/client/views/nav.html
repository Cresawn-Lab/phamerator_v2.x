<template name="nav">
  {{#if currentUser}}
  {{ > editDatasetModal}}
  {{ > infoDatasetModal}}
  {{/if}}


  <div class="fixed-top" style="z-index: 1030;">
    <nav class="navbar navbar-expand-lg bg-purple navbar-dark py-2">
      <div class="container-fluid">
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMobileMenu" aria-controls="navbarMobileMenu" aria-expanded="false" aria-label="Toggle navigation">
          <i class="material-icons text-white">menu</i>
        </button>

        <div class="collapse navbar-collapse" id="navbarMobileMenu">
          {{#if currentUser}}
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center">
            {{#unless loggingIn}}
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false" title="Select a phage database (e.g., Actino_Draft)">
                {{preferredDataset}}
              </a>
              {{ > datasetDropdown }}
            </li>

            {{#if metadata.metadata}}
            <li class="nav-item">
              <a class="nav-link text-white" href="#" data-bs-toggle="modal" data-bs-target="#infoDataset">
                <i class="material-icons">info_outline</i>
              </a>
            </li>
            {{/if}}

            {{#if iAmOwner}}
            <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
              <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#editDataset">Collaborate</button>
            </li>
            {{/if}}
            {{/unless}}
          </ul>
          {{/if}}

          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link text-white {{isActiveRoute regex='home'}}" href="{{pathFor 'home'}}">Home</a></li>
            {{#if currentUser}}
            <li class="nav-item"><a class="nav-link text-white {{isActiveRoute regex='domains'}}" href="{{pathFor 'domains'}}" title="Search for conserved protein domains (e.g., HNH endonuclease) across phages and view matching genes.">Domains</a></li>
            <li class="nav-item"><a class="nav-link text-white {{isActiveRoute regex='phages'}}" href="{{pathFor 'phages'}}" title="Create comparative genome maps to visualize gene synteny, similarity, and annotations.">Genome Maps</a></li>
            <li class="nav-item"><a class="nav-link text-white {{isActiveRoute regex='account'}}" href="{{pathFor 'account'}}">{{displayname}}</a></li>
            <li class="nav-item"><a class="nav-link text-white start-tour-btn" href="#" title="Start an interactive tour of the application">Tour</a></li>
            <li class="nav-item"><a class="nav-link text-white logout-btn" href="#"><i class="material-icons align-middle me-1" style="font-size: 1.1rem;">exit_to_app</i>Logout</a></li>
            {{else}}
            <li class="nav-item"><a class="nav-link text-white" href="#" data-bs-toggle="modal" data-bs-target="#magicLinkModal"><i class="material-icons align-middle me-1" style="font-size: 1.1rem;">login</i>Sign In</a></li>
            {{/if}}
          </ul>
        </div>
      </div>
    </nav>
  </div>
  {{> magicLinkModal }}
  <footer class="app-footer fixed-bottom w-100 text-white">
    <div class="container h-100 d-flex align-items-center justify-content-between">
      <div class="small">
        Phamerator.org {{version}} is produced by the Cresawn Laboratory at James Madison University and SEA-PHAGES 2016-{{now}}.
        <a class="footer-link ms-2" href="{{pathFor 'terms'}}">Terms and Policies</a>
      </div>
      <div class="d-flex align-items-center">
        <a class="footer-link fw-semibold" href="https://seaphages.org" target="_blank" title="Science Education Alliance-Phage Hunters Advancing Genomics and Evolutionary Science">SEA-PHAGES</a>
        <div id="preloader" class="d-none ms-3">
          <div class="spinner-border text-light spinner-border-sm" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>
    </div>
  </footer>
</template>
