name: Build, Scan, and Publish Container

on:
  push:
    branches: [ v2.5, master, main ]
  pull_request:
    branches: [ v2.5, master, main ]
  schedule:
    # Run every Monday at 04:00 UTC (weekly rebuild to ingest upstream security patches)
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-publish:
    name: Build, Scan & Publish
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LC }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/v2.5' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=schedule,pattern={{date 'YYYYMMDD'}}

      # Step 1: Build image and load into runner's Docker daemon for Trivy scanning
      - name: Build local container image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: phamerator
          file: phamerator/Dockerfile
          load: true
          platforms: linux/arm64
          tags: phamerator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      # Step 2: Run Trivy container security scans (SARIF + Table)
      - name: Generate Trivy SARIF report
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --pkg-types os,library \
            phamerator:test

      - name: Generate Trivy Table report
        run: |
          trivy image \
            --format table \
            --output trivy-results.txt \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --pkg-types os,library \
            phamerator:test || true

      - name: Upload SARIF report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'phamerator-v2.5'

      # Step 3: Publish scan report to Actions Summary & console
      - name: Publish security scan report to GitHub Actions summary
        if: always()
        run: |
          if [ -s trivy-results.txt ]; then
            echo "::group::Trivy Security Report"
            cat trivy-results.txt
            echo "::endgroup::"
            {
              echo "### 🛡️ Trivy Container Security Scan Report"
              echo ""
              echo "Target: \`phamerator (v2.5)\`"
              echo ""
              echo "<details open><summary><b>High & Critical vulnerability details</b></summary>"
              echo ""
              echo '```text'
              cat trivy-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🛡️ Trivy Container Security Scan Report" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Clean scan:** No unfixed HIGH or CRITICAL vulnerabilities detected in container." >> $GITHUB_STEP_SUMMARY
          fi

      # Step 4: Enforce CRITICAL vulnerability gate (fails if unfixed CRITICAL CVEs exist)
      - name: Enforce CRITICAL vulnerability gate
        run: |
          echo "Verifying no unfixed CRITICAL vulnerabilities in phamerator..."
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --pkg-types os,library \
            --quiet \
            phamerator:test

      # Step 4: Push verified image to GHCR (skipped on pull requests)
      - name: Push verified container image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: phamerator
          file: phamerator/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
