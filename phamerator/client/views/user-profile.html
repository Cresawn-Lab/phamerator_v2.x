<template name="account">
  {{#if currentUser}}
  <div class="row mb-4 mt-4">
    <div class="col-12 col-md-8 col-lg-6 offset-md-2 offset-lg-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4>{{name}}</h4>
          <p class="text-muted">{{username}} ({{email}})</p>
          <form action="#">
            <p>To make it easier for other
              Phamerator users to share their genomic data with you,
              Phamerator maintains a directory of users' names
              and email addresses. Please indicate whether you would
              like to be listed in the directory. You may change this
              setting at any time.
            </p>

            {{#if includeInDirectory}}
            <div class="form-check d-flex align-items-center mb-2">
              <input class="form-check-input mt-0 me-2" type="radio" name="directoryinfo" id="directoryinfo-yes" checked>
              <label class="form-check-label mb-0" for="directoryinfo-yes">
                Include my name and email address
              </label>
            </div>
            <div class="form-check d-flex align-items-center mb-2">
              <input class="form-check-input mt-0 me-2" type="radio" name="directoryinfo" id="directoryinfo-no">
              <label class="form-check-label mb-0" for="directoryinfo-no">
                Hide my name and email address
              </label>
            </div>
            {{else}}
            <div class="form-check d-flex align-items-center mb-2">
              <input class="form-check-input mt-0 me-2" type="radio" name="directoryinfo" id="directoryinfo-yes">
              <label class="form-check-label mb-0" for="directoryinfo-yes">
                Include my name and email address
              </label>
            </div>
            <div class="form-check d-flex align-items-center mb-2">
              <input class="form-check-input mt-0 me-2" type="radio" name="directoryinfo" id="directoryinfo-no" checked>
              <label class="form-check-label mb-0" for="directoryinfo-no">
                Hide my name and email address
              </label>
            </div>
            {{/if}}
          </form>
        </div>
      </div>
    </div>
  </div>
  <div class="row mb-4">
    <div class="col-12 col-md-8 col-lg-6 offset-md-2 offset-lg-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4>API Access</h4>
          <p>Use an API key to access your Phamerator data programmatically.</p>
          {{#if apiKey}}
          <div class="card bg-light mt-3 mb-3">
            <div class="card-body">
              <p><strong>Your Current API Key:</strong></p>
              {{#if newApiKey}}
              <code style="word-break: break-all; font-size: 1.1em; padding: 10px; display: block; background: #e0e0e0; border-radius: 4px;">{{newApiKey}}</code>
              <br>
              <p class="text-danger mb-0"><small><i class="material-icons align-text-bottom me-1" style="font-size: 1.1rem;">warning</i>This key will only be displayed once. Please copy your API key and store it securely.</small></p>
              {{else}}
              <code style="word-break: break-all; font-size: 1.1em; padding: 10px; display: block; background: #e0e0e0; border-radius: 4px;">••••••••••••••••••••••••••••••</code>
              <br>
              <p class="mb-0"><small>For security reasons, your API key is hidden. If you lost it, you must revoke and generate a new one.</small></p>
              {{/if}}
              {{#if apiKey.lastUsed}}
              <p class="mt-2 mb-0"><small>Last Used: {{apiKey.lastUsed}}</small></p>
              {{/if}}
              <div class="mt-3">
                <button class="btn btn-danger" id="delete-api-key">Revoke API Key</button>
              </div>
            </div>
          </div>
          {{else}}
          <button class="btn btn-primary" id="generate-api-key">Generate New API Key</button>
          {{/if}}
        </div>
      </div>
    </div>
  </div>

  {{/if}}

</template>
