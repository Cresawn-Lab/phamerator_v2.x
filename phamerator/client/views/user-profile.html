<template name="account">
  {{#if currentUser}}
  <div class="row">
    <div class="col s12 m8 l6 offset-m2 offset-l3">
      <div class="card-panel white">
        <span>
          <h4>{{name}}</h4>
          <p>{{username}} ({{email}})</p>
          <form action="#">
            <p>To make it easier for other
              Phamerator users to share their genomic data with you,
              Phamerator maintains a directory of users' names
              and email addresses. Please indicate whether you would
              like to be listed in the directory. You may change this
              setting at any time.
            </p>

            {{#if includeInDirectory}}
            <p>
              <label>
                <input name="directoryinfo" type="radio" id="directoryinfo-yes" checked />
                <span>Include my name and email address</span>
              </label>
            </p>
            <p>
              <label>
                <input name="directoryinfo" type="radio" id="directoryinfo-no" />
                <span>Hide my name and email address</span>
              </label>
            </p>
            {{else}}
            <p>
              <label>
                <input name="directoryinfo" type="radio" id="directoryinfo-yes" />
                <span>Include my name and email address</span>
              </label>
            </p>
            <p>
              <label>
                <input name="directoryinfo" type="radio" id="directoryinfo-no" checked />
                <span>Hide my name and email address</span>
              </label>
            </p>
            {{/if}}
          </form>
        </span>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col s12 m8 l6 offset-m2 offset-l3">
      <div class="card-panel white">
        <h4>API Access</h4>
        <p>Use an API key to access your Phamerator data programmatically.</p>
        {{#if apiKey}}
        <div class="card-panel grey lighten-4">
          <p><strong>Your Current API Key:</strong></p>
          {{#if newApiKey}}
          <code style="word-break: break-all; font-size: 1.1em; padding: 10px; display: block; background: #e0e0e0; border-radius: 4px;">{{newApiKey}}</code>
          <br>
          <p class="red-text"><small><i class="material-icons left" style="font-size: 1rem;">warning</i> This key will only be displayed once. Please copy your API key and store it securely.</small></p>
          {{else}}
          <code style="word-break: break-all; font-size: 1.1em; padding: 10px; display: block; background: #e0e0e0; border-radius: 4px;">••••••••••••••••••••••••••••••</code>
          <br>
          <p><small>For security reasons, your API key is hidden. If you lost it, you must revoke and generate a new one.</small></p>
          {{/if}}
          {{#if apiKey.lastUsed}}
          <p><small>Last Used: {{apiKey.lastUsed}}</small></p>
          {{/if}}
          <br>
          <a class="waves-effect waves-light btn red" id="delete-api-key">Revoke API Key</a>
        </div>
        {{else}}
        <a class="waves-effect waves-light btn" id="generate-api-key">Generate New API Key</a>
        {{/if}}
      </div>
    </div>
  </div>
  <div class="row">
    {{>uploadForm}}
  </div>
  {{/if}}

</template>

<template name="uploadForm">
  {{#if currentUpload}}
  {{#with currentUpload}}
  {{/with}}
  {{else}}
  <div class="col s12 m8 l6 offset-m2 offset-l3">
    <form action="#">
      <div class="file-field input-field">
        <div class="btn">
          <span>upload a picture</span>
          <input id="fileInput" type="file">
        </div>
        <div class="file-path-wrapper">
          <input class="file-path validate" type="text">
        </div>
      </div>
    </form>
  </div>

  {{/if}}
</template>
