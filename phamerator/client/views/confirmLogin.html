<template name="confirmLogin">
    <div class="container center-align" style="margin-top: 10%;">
        <div class="row">
            <div class="col s12 m8 offset-m2">
                <div class="card">
                    <div class="card-content">
                        <span class="card-title" style="color: #2196F3;">Secure Sign In</span>
                        <p class="flow-text" style="font-size: 1.2rem; margin: 2rem 0;">
                            You are about to sign in to Phamerator. Please click the button below to confirm.
                        </p>
                        <div class="action-section" style="margin-top: 2rem;">
                            <button id="confirm-signin" class="waves-effect waves-light btn-large teal">
                                <i class="material-icons left">vpn_key</i>
                                Finalize Sign In
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
